# Gestor de Tareas Operativas — entorno completo
#   cp .env.example .env
#   docker compose up --build
# Orden de arranque: db (healthy) → db-init (crea BD, SPs, usuario de app) → backend (healthy) → frontend
# Solo se publica el puerto del frontend; la BD y la API quedan en la red interna.

name: task-manager

services:
  db:
    # SQL Server 2022 CU27 (16.0.4295.3), fijada por digest: siempre se descarga la versión probada.
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
    platform: linux/amd64 # La imagen solo existe para x86_64 (en ARM usa emulación).
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env (cp .env.example .env)}
      # sqlcmd lee la contraseña de aquí: el healthcheck no la expone en la línea de comandos.
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  db-init:
    # Reutiliza la imagen de SQL Server porque ya trae sqlcmd. Se ejecuta y termina.
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
    platform: linux/amd64
    entrypoint: ["bash", "/db/init/run-scripts.sh"]
    environment:
      DB_HOST: db
      DB_PORT: 1433
      DB_NAME: ${DB_NAME:?Define DB_NAME en .env}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_APP_USER: ${DB_APP_USER:?Define DB_APP_USER en .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Define DB_APP_PASSWORD en .env}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: task-manager-api
    # Solo recibe lo que necesita: nunca la contraseña de SA.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: 3000
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DB_HOST: db
      DB_PORT: 1433
      DB_NAME: ${DB_NAME}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_ENCRYPT: ${DB_ENCRYPT:-true}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:-true}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-10}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-15}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:?Define SEED_ADMIN_USERNAME en .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Define SEED_ADMIN_PASSWORD en .env}
      SEED_ADMIN_FULL_NAME: ${SEED_ADMIN_FULL_NAME:-Administrador}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      AUTH_CAPTCHA: ${AUTH_CAPTCHA:-true}
      # Correo para "¿Olvidaste tu contraseña?". Por defecto, el servidor de pruebas (mail).
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Gestor de Tareas <no-responder@fastco.test>}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
    depends_on:
      db-init:
        condition: service_completed_successfully
      mail:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  mail:
    # Servidor de correo de pruebas (Mailpit): captura los correos que envía la app, no los
    # entrega a nadie. Bandeja en http://localhost:8025, publicada solo en la máquina local.
    # En producción se reemplaza por el SMTP corporativo con SMTP_HOST / SMTP_PORT / SMTP_USER.
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: task-manager-web
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  mssql-data:
