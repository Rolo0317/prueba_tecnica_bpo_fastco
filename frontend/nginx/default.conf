server {
    listen 8080;
    server_name _;
    server_tokens off;

    # DNS interno de Docker: el nombre "backend" se resuelve en cada petición, así nginx
    # sigue funcionando si el contenedor de la API se recrea y cambia de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:3000;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: mismo origen que el frontend → el navegador no necesita CORS.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 32k;
    }

    # Archivos con hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: cualquier ruta del router de Vue devuelve index.html (sin caché, para tomar despliegues nuevos).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
